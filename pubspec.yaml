publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: ^3.41.9

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  country_flags: ^4.1.2
  cupertino_icons: ^1.0.8
